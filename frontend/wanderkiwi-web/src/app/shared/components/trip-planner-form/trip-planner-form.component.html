<div class="planner-form-card">
  <div class="form-header">
    <span class="sparkle">✨</span>
    <h3>Plan Your Trip</h3>
  </div>
  <p class="form-sub">
    Tell us your preferences and we'll craft the perfect itinerary for you.
  </p>

  <!-- Form Error Banner -->
  <div *ngIf="formError" class="form-error-alert" role="alert">
    ⚠️ {{ formError }}
  </div>

  <div class="input-group autocomplete-container">
    <label>Where do you want to go?</label>
    <div class="input-with-icon">
      <span>📍</span>
      <input
        type="text"
        name="destination"
        [(ngModel)]="request.destination"
        (input)="onInputChange()"
        placeholder="Type a city (e.g. Queenstown)"
        autocomplete="off"
        required
      />
    </div>
    <!-- Dropdown Suggestions Box -->
    <ul class="suggestions-dropdown" *ngIf="isDropdownOpen">
      <li
        *ngFor="let dest of filteredDestinations"
        (click)="selectDestination(dest)"
      >
        {{ dest.name }} <small>({{ dest.regionName }})</small>
      </li>
    </ul>
    <!-- Error message if invalid place is entered -->
    <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <div class="date-row">
    <div class="input-group">
      <label>Start date</label>
      <div class="input-with-icon">
        <span>📅</span>
        <input
          type="date"
          name="startDate"
          [(ngModel)]="request.startDate"
          [min]="todayDateString"
          (change)="onStartDateChange()"
          required
        />
      </div>
    </div>
    <div class="input-group">
      <label>End date</label>
      <div class="input-with-icon">
        <span>📅</span>
        <input
          type="date"
          name="endDate"
          [(ngModel)]="request.endDate"
          [min]="request.startDate || todayDateString"
          [max]="maxEndDateString"
          required
        />
      </div>
    </div>
  </div>

  <div class="trip-row">
    <div class="input-group">
      <label>Start time</label>
      <div class="input-with-icon">
        <span>⏰</span>
        <input
          type="time"
          name="startTime"
          [(ngModel)]="request.startTime"
          required
        />
      </div>
    </div>

    <div class="input-group">
      <label>Travelers</label>
      <div class="input-with-icon">
        <span>👥</span>
        <input
          type="number"
          name="travellers"
          [(ngModel)]="request.travellers"
          min="1"
          max="20"
          step="1"
          required
          placeholder="e.g. 2"
        />
      </div>
    </div>
  </div>
  <div class="input-group">
    <label>Trip style</label>
    <div class="input-with-icon">
      <select name="tripStyle" [(ngModel)]="request.tripStyle">
        <option value="Adventure">Adventure</option>
        <option value="Relaxation">Relaxation</option>
        <option value="Road Trip">Road Trip</option>
      </select>
    </div>
  </div>

  <div class="input-group">
    <label>Interests (select up to 3)</label>
    <div class="interests-grid">
      <button
        *ngFor="let interest of availableInterests"
        [class.active]="isInterestSelected(interest)"
        (click)="toggleInterest(interest)"
      >
        {{ interest }}
      </button>
    </div>
  </div>

  <div class="input-group">
    <label>Budget range</label>
    <div class="input-with-icon">
      <span>💰</span>
      <select [(ngModel)]="request.budget">
        <option value="Mid-range">Mid-range</option>
        <option value="Budget">Budget</option>
        <option value="Luxury">Luxury</option>
      </select>
    </div>
  </div>

  <button class="generate-btn" (click)="onSubmit()" [disabled]="isSubmitting">
    {{ isSubmitting ? "Saving trip…" : "✨ Create My Trip" }}
  </button>
  <small class="ai-note"
    >Your trip is saved with a day-by-day plan ready for you to
    customise.</small
  >
</div>
