<section class="hero">
      <div class="hero-content">
        <h1>Discover New Zealand</h1>
        <p class="subtitle">Your next adventure starts here. AI-powered trip planning made easy.</p>
        
        <div class="search-box">
          <input type="text" [(ngModel)]="searchQuery" placeholder="Search destinations, places, activities..." />
          <button (click)="onSearch()">🔍 Search</button>
        </div>

        <div class="popular-searches">
          <span>Popular Searches:</span>
          <button *ngFor="let tag of popularTags" (click)="selectTag(tag)">{{ tag }}</button>
        </div>
      </div>
    </section>
