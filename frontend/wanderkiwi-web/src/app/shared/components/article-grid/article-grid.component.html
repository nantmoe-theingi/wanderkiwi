<div class="content-area">
  <!-- Sort Header -->
  <div class="results-header">
    <div>
      <h2>{{ selectedCategory }}</h2>
      <span class="count-label">{{ articles.length }} articles</span>
    </div>
    <div class="sort-box">
      <span>Sort by:</span>
      <select [(ngModel)]="sortBy">
        <option value="latest">Latest</option>
        <option value="popular">Most Popular</option>
      </select>
    </div>
  </div>

  <!-- Article Grid -->
  <div class="article-grid">
    <div
      *ngFor="let article of paginatedArticles"
      class="article-card"
      [routerLink]="['/articles', article.id]"
      style="cursor: pointer"
    >
      <div class="card-img-wrapper">
        <img [src]="article.imageUrl" [alt]="article.title" />
        <span class="category-badge">{{ article.category }}</span>
        <button class="bookmark-btn" aria-label="Save">🔖</button>
      </div>
      <div class="card-body">
        <h3>{{ article.title }}</h3>
        <p>{{ article.description }}</p>

        <div class="card-meta">
          <div class="author">
            <img
              [src]="
                article.authorAvatar || 'assets/images/wanderkiwi-logo.png'
              "
              [alt]="article.authorName"
            />
            <span>{{ article.authorName }}</span>
          </div>
          <div class="date-read">
            <span>{{ article.date }}</span> •
            <span>{{ article.readTime }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination Footer -->
  <div class="pagination" *ngIf="totalPages > 1">
    <button
      class="page-arrow"
      (click)="prevPage()"
      [disabled]="currentPage === 1"
    >
      ←
    </button>

    <button
      *ngFor="let page of [].constructor(totalPages); let i = index"
      class="page-num"
      [class.active]="currentPage === i + 1"
      (click)="setPage(i + 1)"
    >
      {{ i + 1 }}
    </button>

    <button
      class="page-arrow"
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
    >
      →
    </button>
  </div>
</div>
