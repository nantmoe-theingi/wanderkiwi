<section class="section why-section">
      <h2>Why WanderKiwi?</h2>
      <div class="features-grid">
        <div *ngFor="let f of features" class="feature-card">
          <div class="feature-icon">{{ f.icon }}</div>
          <h3>{{ f.title }}</h3>
          <p>{{ f.desc }}</p>
        </div>
      </div>
    </section>
