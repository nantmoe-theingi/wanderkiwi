<header class="header">
 

  <div class="logo-container" style="position: relative; height: 40px;">
  <img src="assets/images/wanderkiwi-logo.png" alt="WanderKiwi Logo" width="40" height="40" class="logo-icon" />
  <span class="logo-text">WanderKiwi</span>
</div>

  <nav class="nav-links">
        <a *ngFor="let item of navItems" 
           [routerLink]="[item.route]" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{ exact: item.exactMatch || false }">
          {{ item.label }}
        </a>
      </nav>
  <!-- <div class="header-actions">
        
        <button class="wishlist-btn" title="Saved Favourites">
          ❤️ <span class="badge" *ngIf="(wishlistCount$ | async)! > 0">{{ wishlistCount$ | async }}</span>
        </button>
        <button class="cta-btn">Start Planning</button>
      </div> -->

  <div class="header-actions">
    <button class="cta-btn">Start Planning</button>
    <button (click)="onClickBookmark()" class="wishlist-btn" title="Saved Destinations">
      <!-- Bookmark Icon using SVG for a clean, modern look -->
      <!-- Wishlist count connected via the async pipe from WishlistService -->
      <svg
        class="bookmark-icon"
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none" 
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="badge" *ngIf="(wishlistCount$ | async)! > 0">{{
        wishlistCount$ | async
      }}</span>
    </button>
  </div>
</header>
