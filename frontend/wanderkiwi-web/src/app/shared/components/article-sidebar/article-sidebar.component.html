<aside class="sidebar">
  <!-- Categories list -->
  <div class="sidebar-section">
    <h3>Categories</h3>
    <ul class="category-list">
      <li
        *ngFor="let cat of categories"
        [class.active]="selectedCategory === cat.name"
        (click)="selectCategory(cat.name)"
      >
        <span class="cat-label">
          <span class="icon">{{ cat.icon }}</span> {{ cat.name }}
        </span>
        <span class="count">{{ cat.count }}</span>
      </li>
    </ul>
  </div>

  <!-- Popular Reads Section (Optional: Shows on Detail Page if provided) -->
  <div class="sidebar-section" *ngIf="popularReads && popularReads.length > 0">
    <h3>Popular Reads</h3>
    <div class="popular-reads-list">
      <div *ngFor="let pop of popularReads" class="popular-read-item" [routerLink]="['/articles', pop.id]">
        <img [src]="pop.imageUrl" [alt]="pop.title" />
        <div class="pop-info">
          <h4>{{ pop.title }}</h4>
          <span>{{ pop.readTime }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Newsletter Box -->
  <div class="sidebar-section newsletter-box">
    <div class="nl-header">
      <span>✉️</span>
      <h3>Get travel inspiration</h3>
    </div>
    <p>
      Subscribe to our newsletter for the latest guides, tips and travel ideas.
    </p>
    <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
    <button class="subscribe-btn" (click)="subscribe()">Subscribe</button>
  </div>
</aside>
