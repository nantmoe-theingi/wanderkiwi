<div class="hero-section">
  <div class="hero-overlay">
    <div class="hero-content">
      <h1>{{ title }}</h1>
      <p>{{ subtitle }}</p>

      <!-- Search Bar conditionally displayed -->
      <div class="search-box" *ngIf="showSearch">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          [(ngModel)]="searchQuery" 
          (input)="onSearchInput()" 
          placeholder="Search articles, guides, tips..." 
        />
      </div>
    </div>
  </div>
</div>
