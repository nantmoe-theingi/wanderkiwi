<section class="articles-hero">
  <div class="hero-container">
    <h1>Travel Articles & Guides</h1>
    <p>
      Inspiration, tips, and local insights to help you explore New Zealand like
      a local.
    </p>

    <div class="search-box">
      <span>🔍</span>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Search articles, guides, tips..."
      />
    </div>
  </div>
</section>
