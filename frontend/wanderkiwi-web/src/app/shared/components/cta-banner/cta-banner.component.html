<div class="cta-banner">
  <div class="image-wrapper">
    <img [src]="ctaBannerImageUrl" alt="Ready for your next adventure" />
    <div class="banner-overlay"></div>
  </div>

  <div class="cta-content">
    <div class="cta-text">
      <h2>Ready for your next adventure?</h2>
      <p>Start planning your dream New Zealand trip today.</p>
    </div>
    <button class="start-planning-btn" (click)="goToPlanner()">
      Start Planning Now →
    </button>
  </div>
</div>
