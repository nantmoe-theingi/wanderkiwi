<footer class="footer">
  <div class="footer-container">
    <!-- Brand Column -->
    <div class="footer-col brand-col">
      <div class="logo" style="position: relative; height: relative;">
       
        <img src="logoPath" alt="WanderKiwi Logo" width="40" height="40" class="logo-icon" />
        <span class="logo-text">WanderKiwi</span>
      </div>

      <p>
        AI-powered travel planning for unforgettable journeys across New
        Zealand.
      </p>
      <div class="socials">
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="Instagram">ig</a>
        <a href="#" aria-label="YouTube">yt</a>
      </div>
    </div>

    <!-- Quick Links (Dynamically looped) -->
    <div class="footer-col">
      <h4>Quick Links</h4>
      <a *ngFor="let item of quickLinks" [routerLink]="[item.route]">
        {{ item.label }}
      </a>
    </div>

    <!-- Information Links (Dynamically looped) -->
    <div class="footer-col">
      <h4>Information</h4>
      <a *ngFor="let item of informationLinks" [routerLink]="[item.route]">
        {{ item.label }}
      </a>
    </div>

    <!-- Support Links (Dynamically looped) -->
    <div class="footer-col">
      <h4>Support</h4>
      <a *ngFor="let item of supportLinks" [routerLink]="[item.route]">
        {{ item.label }}
      </a>
    </div>

    <!-- Newsletter Column -->
    <div class="footer-col newsletter-col">
      <h4>Newsletter</h4>
      <p>Get travel inspiration and tips delivered to your inbox.</p>
      <div class="newsletter-input">
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        />
        <button (click)="subscribe()">Subscribe</button>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; 2026 WanderKiwi. All rights reserved.</p>
  </div>
</footer>
