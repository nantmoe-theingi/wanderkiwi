<div class="trip-planner-page">
  <section class="planner-hero">
    <div class="hero-container">
      <span class="pre-title">PLAN YOUR ADVENTURE</span>
      <h1>Trip Planner</h1>
      <p>
        Create your perfect New Zealand adventure.<br />AI-powered
        recommendations, personalised for you.
      </p>
    </div>
  </section>

  <div class="planner-container">
    <!-- Left Form -->
    <app-trip-planner-form
      [isSubmitting]="isSubmitting"
      (formSubmitted)="onGenerateTrip($event)">
    </app-trip-planner-form>

    <!-- Right Itinerary Results & Map -->
    <p *ngIf="errorMessage" class="planner-error" role="alert">{{ errorMessage }}</p>
    <app-trip-itinerary [tripPlan]="tripPlan"> </app-trip-itinerary>
  </div>
</div>
